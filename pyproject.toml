[project]
name = "varistha-workspace"
version = "0.1.0"
description = "Varistha monorepo workspace root"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/cli",
    "packages/spec",
    "packages/sdk",
]

[tool.uv.sources]
varistha-api = { workspace = true }
varistha-worker = { workspace = true }
varistha-cli = { workspace = true }
varistha-spec = { workspace = true }
varistha-sdk = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.380",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific
    "S",      # flake8-bandit
    "PT",     # flake8-pytest-style
    "ERA",    # eradicate
    "D",      # pydocstyle
]
ignore = [
    "D100",   # Missing docstring in public module (too noisy early)
    "D104",   # Missing docstring in public package
    "D203",   # 1 blank line before class docstring (conflicts with D211)
    "D213",   # Multi-line docstring summary second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D103", "D100"]  # Allow assert, no docstrings in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
venvPath = "."
venv = ".venv"
extraPaths = [
    "apps/api/src",
    "apps/worker/src",
    "packages/cli/src",
    "packages/spec/src",
    "packages/sdk/src",
]

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end tests",
]
addopts = "--strict-markers -v"
