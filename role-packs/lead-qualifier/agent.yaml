apiVersion: varistha/v1
kind: Agent
metadata:
  name: lead-qualifier
  owner: sales-ops@varistha.ai
  stage: prototype
  version: 0.1.0
spec:
  role: >
    Autonomous Inbound Lead Qualifier and Scorer that evaluates incoming demo requests,
    form inquiries, and signups against a BANT/MEDDPICC scoring matrix, classifies buyer intent,
    and routes prospects to appropriate sales channels.
  model:
    primary: gpt-4o-mini
    fallback: gpt-3.5-turbo
  instructions: prompts/system.md
  plugins:
    - name: crm-export
      enabled: true
    - name: email-draft
      enabled: true
  autonomy: L1
  guardrails:
    input:
      - pii-redact
      - injection-scan
    output:
      - schema-valid
    tools:
      - outbound-needs-approval
  budget:
    max_usd_per_run: 0.25
    max_usd_per_day: 10.00
  triggers:
    - type: manual
    - type: webhook
  evals:
    suite: evals/suite.yaml
    min_pass_rate: 0.85
