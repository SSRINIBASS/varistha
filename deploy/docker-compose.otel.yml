# =============================================================================
# Varistha OpenTelemetry & Observability Profile Overlay
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.otel.yml up
# Or:
#   docker compose --profile otel up
# =============================================================================

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: varistha-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      VARISTHA_API_URL: ${VARISTHA_API_URL:-http://api:8000}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_AUTH_HEADER: ${LANGFUSE_AUTH_HEADER:-}
      TEMPO_OTLP_ENDPOINT: ${TEMPO_OTLP_ENDPOINT:-tempo:4317}
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "13133:13133"
    depends_on:
      api:
        condition: service_healthy
