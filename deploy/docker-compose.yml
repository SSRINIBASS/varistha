services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: varistha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-varistha}
      POSTGRES_USER: ${POSTGRES_USER:-varistha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-varistha_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-varistha} -d ${POSTGRES_DB:-varistha}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: varistha-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-varistha}:${POSTGRES_PASSWORD:-varistha_dev_password}@postgres:5432/${POSTGRES_DB:-varistha}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: varistha-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-varistha}:${POSTGRES_PASSWORD:-varistha_dev_password}@postgres:5432/${POSTGRES_DB:-varistha}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  ui:
    build:
      context: ../apps/ui
      dockerfile: Dockerfile
    container_name: varistha-ui
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: varistha_postgres_data
