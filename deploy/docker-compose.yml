services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: varistha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-varistha}
      POSTGRES_USER: ${POSTGRES_USER:-varistha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-varistha_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-varistha} -d ${POSTGRES_DB:-varistha}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: varistha-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-varistha}:${POSTGRES_PASSWORD:-varistha_dev_password}@postgres:5432/${POSTGRES_DB:-varistha}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-varistha-api}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: varistha-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-varistha}:${POSTGRES_PASSWORD:-varistha_dev_password}@postgres:5432/${POSTGRES_DB:-varistha}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-varistha-worker}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  ui:
    build:
      context: ../apps/ui
      dockerfile: Dockerfile
    container_name: varistha-ui
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: varistha-otel-collector
    restart: unless-stopped
    profiles:
      - otel
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      VARISTHA_API_URL: ${VARISTHA_API_URL:-http://api:8000}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_AUTH_HEADER: ${LANGFUSE_AUTH_HEADER:-}
      TEMPO_OTLP_ENDPOINT: ${TEMPO_OTLP_ENDPOINT:-tempo:4317}
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "13133:13133"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: varistha_postgres_data

