[project]
name = "varistha-worker"
version = "0.1.0"
description = "Varistha background worker for agent execution"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "varistha-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
