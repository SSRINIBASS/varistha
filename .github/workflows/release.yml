name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Architecture boundaries check
        run: uv run python scripts/check_boundaries.py

      - name: Ruff linter
        run: uv run ruff check .

      - name: Pyright type checker
        run: uv run pyright apps/api

      - name: Run test suite
        run: uv run pytest -q

  build-docker:
    name: Build & Push Docker Images
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${TAG}" = "" ] || [ "${TAG}" = "main" ] || [ "${TAG}" = "master" ]; then
            TAG="latest"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          REPO_LC="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "repo_lc=${REPO_LC}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lc }}/api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}/api:latest

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lc }}/worker:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}/worker:latest

      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: apps/ui
          file: apps/ui/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lc }}/ui:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}/ui:latest

  build-pypi-packages:
    name: Build Python Packages
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build packages/spec wheel
        run: python -m build packages/spec

      - name: Build packages/sdk wheel
        run: python -m build packages/sdk

      - name: Build packages/cli wheel
        run: python -m build packages/cli

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-packages
          path: |
            packages/spec/dist/*.whl
            packages/sdk/dist/*.whl
            packages/cli/dist/*.whl
