[project]
name = "varistha-cli"
version = "0.1.0"
description = "Varistha CLI — manage agent specs and runs from the command line"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "varistha-spec",
]

[project.scripts]
varistha = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
