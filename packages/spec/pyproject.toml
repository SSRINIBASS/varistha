[project]
name = "varistha-spec"
version = "0.1.0"
description = "Varistha Agent Spec schema, Pydantic models, and validators"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.10.0",
    "pydantic[email]>=2.10.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    # email-validator is required by pydantic[email] for EmailStr validation.
    # License: MIT. Actively maintained (v2+). Needed for agent owner field.
    "email-validator>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
