[project]
name = "varistha-spec"
version = "0.1.0"
description = "Varistha Agent Spec schema, Pydantic models, and validators"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
